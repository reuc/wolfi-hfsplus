# Build, test and publish the image to Docker Hub.
#
# Publishes docker.io/<DOCKER_USER>/wolfi-hfsplus (linux/amd64 + linux/arm64)
# from main, only after both smoke tests (locked and privileged) and the grype
# CVE gate pass on the exact image that gets pushed. Each architecture image
# gets an SBOM attestation and a cosign signature; the multi-arch index gets a
# cosign signature and SLSA build provenance.
#
# Tags: latest, YYYYMMDD, sha-<short commit>  (per-arch: sha-<short>-<arch>)
# Pin by digest.
#
# Repository settings needed:
#   DOCKER_USER   Docker Hub user/namespace (a variable or a secret)
#   DOCKER_TOKEN  Docker Hub access token with Read & Write scope (secret)
name: publish

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "tests/smoke.py"
      - "Makefile"
      - ".dockerignore"
      - ".github/scripts/**"
      - ".github/workflows/publish.yml"
  schedule:
    # Daily, after build-and-scan (06:17), so new Wolfi fixes are published.
    - cron: "41 7 * * *"
  workflow_dispatch:
  # Dry run on PRs that change this workflow: gates only, no login or push.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: read

concurrency:
  # Never cancel a publish midway.
  group: publish
  cancel-in-progress: false

env:
  IMAGE: wolfi-hfsplus
  DOCKER_NS: ${{ vars.DOCKER_USER || secrets.DOCKER_USER }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  gate:
    name: gate (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # keyless cosign signing
      attestations: write # SBOM attestation
    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TAG: ci-${{ github.run_id }}
      PLATFORM: linux/${{ matrix.arch }}
      ARCH: ${{ matrix.arch }}
    steps:
      # First, so a missing secret fails in seconds rather than after the build.
      - name: Check Docker Hub settings
        if: env.PUBLISH == 'true'
        env:
          HAS_TOKEN: ${{ secrets.DOCKER_TOKEN != '' }}
        run: |
          [ -n "$DOCKER_NS" ] || { echo "::error::Set DOCKER_USER (repository variable or secret)"; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "::error::Set the DOCKER_TOKEN secret (Docker Hub access token, Read & Write)"; exit 1; }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Source commit
        id: src
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install grype
        id: grype
        uses: anchore/scan-action/download-grype@v7

      - name: Load hfsplus kernel module (best effort)
        run: .github/scripts/load-hfsplus.sh

      - name: Build
        # NO_CACHE so every build resolves the latest Wolfi packages.
        run: .github/scripts/run-annotated.sh "Build ${ARCH}" make build NO_CACHE=1

      - name: Verify image architecture
        run: |
          ref=$(make -s image-ref)
          got=$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$ref")
          echo "$ref is $got"
          [ "$got" = "linux/${ARCH}" ]

      - name: Smoke test (locked down)
        run: .github/scripts/run-annotated.sh "Smoke test locked/${ARCH}" make test-locked

      - name: Smoke test (privileged)
        run: .github/scripts/run-annotated.sh "Smoke test privileged/${ARCH}" make test-privileged

      - name: CVE gate
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: .github/scripts/run-annotated.sh "CVE gate ${ARCH}" make scan GRYPE="$GRYPE"

      - name: Upload grype report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: grype-publish-${{ matrix.arch }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      # ---- publish the tested per-architecture image (not on pull requests)

      - name: Log in to Docker Hub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_NS }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push ${{ matrix.arch }} image
        id: push
        if: env.PUBLISH == 'true'
        env:
          SHORT: ${{ steps.src.outputs.short }}
        run: |
          local_ref=$(make -s image-ref)
          remote="docker.io/${DOCKER_NS}/${IMAGE}:sha-${SHORT}-${ARCH}"
          docker tag "$local_ref" "$remote"
          docker push "$remote" | tee push.log
          digest=$(grep -o 'digest: sha256:[0-9a-f]*' push.log | head -1 | cut -d' ' -f2)
          [ -n "$digest" ] || { echo "::error::could not read the pushed digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "local_ref=$local_ref" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.push.outputs.local_ref }}
          format: spdx-json
          output-file: sbom-${{ matrix.arch }}.spdx.json
          upload-artifact: false

      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/${{ env.DOCKER_NS }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2 (no floating major tag)

      - name: Sign ${{ matrix.arch }} image
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKER_NS}/${IMAGE}@${DIGEST}"

  publish:
    name: publish multi-arch image
    needs: gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # keyless cosign signing
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Tags
        id: tags
        run: |
          {
            echo "short=$(git rev-parse --short=7 HEAD)"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_NS }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Create multi-arch image
        id: index
        env:
          SHORT: ${{ steps.tags.outputs.short }}
          DATE: ${{ steps.tags.outputs.date }}
        run: |
          repo="docker.io/${DOCKER_NS}/${IMAGE}"
          docker buildx imagetools create \
            -t "$repo:latest" -t "$repo:${DATE}" -t "$repo:sha-${SHORT}" \
            "$repo:sha-${SHORT}-amd64" "$repo:sha-${SHORT}-arm64"
          digest=$(docker buildx imagetools inspect "$repo:sha-${SHORT}" --format '{{json .Manifest}}' | jq -r .digest)
          [ -n "$digest" ] && [ "$digest" != null ] || { echo "::error::could not read the index digest"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$repo:sha-${SHORT}"

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.2 (no floating major tag)

      - name: Sign multi-arch image
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
        run: cosign sign --yes "docker.io/${DOCKER_NS}/${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: index.docker.io/${{ env.DOCKER_NS }}/${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true

      - name: Summary
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          SHORT: ${{ steps.tags.outputs.short }}
          DATE: ${{ steps.tags.outputs.date }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          repo="docker.io/${DOCKER_NS}/${IMAGE}"
          {
            echo "### Published ${repo}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Digest | \`${DIGEST}\` |"
            echo "| Tags | \`latest\`, \`${DATE}\`, \`sha-${SHORT}\` |"
            echo "| Platforms | linux/amd64, linux/arm64 |"
            echo "| Source | ${REPO_SLUG}@${SHORT} |"
            echo
            echo "Pull by digest: \`docker pull ${repo}@${DIGEST}\`"
            echo
            echo "Run (privileged, root): \`docker run --rm -it --privileged ${repo}@${DIGEST}\`"
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify ${repo}@${DIGEST} \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  --certificate-identity-regexp '^https://github.com/${REPO_SLUG}/\\.github/workflows/publish\\.yml@'"
            echo "gh attestation verify oci://${repo}@${DIGEST} -R ${REPO_SLUG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
